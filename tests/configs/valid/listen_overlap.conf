# wildcard and specific address on one port: one socket, routed per connection
server {
	listen 8710;
	server_name a.test;
	root www/a;
	location / {
		allow_methods GET;
	}
}
server {
	listen 127.0.0.1:8710;
	server_name b.test;
	root www/b;
	location / {
		allow_methods GET;
	}
}
server {
	listen 127.0.0.1:8711;
	listen localhost:8711;
	root www/c;
	location / {
		allow_methods GET;
	}
}
