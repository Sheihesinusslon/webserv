server {
	listen 8200;
	root www/site;
	error_page 404 www/errors/404.html;

	location / {
		allow_methods GET;
	}
	location /assets {
		allow_methods GET;
		autoindex on;
	}
	location /a {
		allow_methods GET;
	}
	location /a/b {
		allow_methods GET POST;
	}
	location /uploads {
		allow_methods GET POST DELETE;
		upload_store www/uploads;
	}
	location /cgi-bin {
		allow_methods GET POST;
		cgi_ext .py /usr/bin/python3;
	}
	location /old {
		return 301 /new;
	}
	location /trailing/ {
		allow_methods GET;
	}
}

server {
	listen 8201;
	root www/second;

	location /only {
		allow_methods GET;
	}
}
