server {
	listen 8900;
	server_name big.test;
	root www/site;
	client_max_body_size 5000;

	location / {
		allow_methods GET POST;
	}

	location /upload {
		allow_methods POST;
		client_max_body_size 9000;
	}
}

server {
	listen 8900;
	root www/second;
	client_max_body_size 100;

	location /api {
		allow_methods POST;
	}
}
