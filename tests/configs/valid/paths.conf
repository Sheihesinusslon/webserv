server {
	listen 8400;
	root www/site;

	location / {
		allow_methods GET;
	}
	location /kapouet {
		root /tmp/www;
		allow_methods GET;
	}
	location /assets {
		allow_methods GET;
	}
	location /slashroot {
		root /var/data/;
		allow_methods GET;
	}
	location /deep/nested {
		root /srv/x;
		allow_methods GET;
	}
	location /dotty {
		root /srv/./a/b/../c;
		allow_methods GET;
	}
	location /slashonly {
		root /;
		allow_methods GET;
	}
}

server {
	listen 8401;

	location /orphan {
		allow_methods GET;
	}
}
