# the same overlap for IPv6; [::] and 0.0.0.0 never cover each other
server {
	listen [::]:8720;
	root www/a6;
	location / {
		allow_methods GET;
	}
}
server {
	listen [::1]:8720;
	root www/b6;
	location / {
		allow_methods GET;
	}
}
server {
	listen 8720;
	root www/a4;
	location / {
		allow_methods GET;
	}
}
