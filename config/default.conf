server {
	listen 127.0.0.1:8080;
	listen 8081;
	server_name webserv.test;

	root www/site;
	index index.html;
	autoindex off;
	client_max_body_size 1048576;

	error_page 403 www/errors/403.html;
	error_page 404 www/errors/404.html;
	error_page 405 www/errors/405.html;
	error_page 413 www/errors/413.html;
	error_page 500 www/errors/500.html;

	location / {
		allow_methods GET;
	}

	location /assets {
		allow_methods GET;
		autoindex on;
	}

	# /kapouet/pouic/toto/pouet is served from /tmp/www/pouic/toto/pouet
	# check out CONFIG_MODULE.md for the detailed explanation
	location /kapouet {
		root /tmp/www;
		allow_methods GET;
		autoindex on;
	}

	location /uploads {
		allow_methods GET POST DELETE;
		upload_store www/uploads;
		client_max_body_size 10485760;
		autoindex on;
	}

	location /cgi-bin {
		root www/cgi-bin;
		allow_methods GET POST;
		cgi_ext .py /usr/bin/python3;
		cgi_ext .php /usr/bin/php-cgi;
	}

	location /old-site {
		return 301 /;
	}
}

server {
	listen 8082;
	server_name second.test;

	root www/second;
	index index.html;
	autoindex off;
	client_max_body_size 1048576;

	error_page 404 www/errors/404.html;

	location / {
		allow_methods GET;
	}

	location /api {
		root www/second/api;
		allow_methods GET POST DELETE;
	}
}
